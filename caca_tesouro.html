<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça Tesouro VR - UEPG</title>
  <meta name="description" content="Projeto de extensão 3 - UEPG">
  <meta name="author" content="Michel de Lima">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <canvas id="canvas-portugues" width="768" height="144"></canvas>      <!-- palavra a traduzir -->
      <canvas id="canvas-feedback" width="1536" height="128"></canvas>      <!-- mensagens rápidas -->
      <canvas id="canvas-instrucoes" width="1200" height="800"></canvas>    <!-- cartão de instruções -->
    </a-assets>

    <!-- Câmera, cursor e HUD (o HUD fica preso à câmera, sempre visível) -->
    <a-camera position="0 1.6 0">
      <a-cursor id="cursor" color="red"></a-cursor>

      <a-entity id="hud" position="0 0 -1.6" scale="0.65 0.65 0.65">

        <!-- Linha no topo: Tempo | Enunciado | Pontos -->
        <a-entity position="-1.72 1.68 0">
          <a-plane width="1.64" height="0.56" position="0 0 -0.002" material="shader: flat; color: #ffb32c"></a-plane>
          <a-plane width="1.6" height="0.52" material="shader: flat; color: #071540; opacity: 0.92; transparent: true"></a-plane>
          <a-text value="Tempo" color="#ffd27a" align="center" width="2.6" position="0 0.16 0.01"></a-text>
          <a-text id="timer" value="10:00" color="#ffffff" align="center" width="5.2" position="0 -0.07 0.01"></a-text>
        </a-entity>

        <a-entity id="prompt-panel" position="0 1.68 0">
          <a-plane width="1.64" height="0.56" position="0 0 -0.002" material="shader: flat; color: #7fe3ff"></a-plane>
          <a-plane width="1.6" height="0.52" material="shader: flat; color: #071540; opacity: 0.92; transparent: true"></a-plane>
          <a-text id="prompt-label" value="Traduza" color="#c4f1ff" align="center" width="2.6" position="0 0.16 0.01"></a-text>
          <!-- Palavra em português: plano com textura de canvas (aceita acentos e "ç") -->
          <a-plane id="portuguese-word" width="1.5" height="0.28125" position="0 -0.07 0.01"
                   material="shader: flat; src: #canvas-portugues; transparent: true"></a-plane>
        </a-entity>

        <a-entity position="1.72 1.68 0">
          <a-plane width="1.64" height="0.56" position="0 0 -0.002" material="shader: flat; color: #ffb32c"></a-plane>
          <a-plane width="1.6" height="0.52" material="shader: flat; color: #071540; opacity: 0.92; transparent: true"></a-plane>
          <a-text value="Pontos" color="#ffd27a" align="center" width="2.6" position="0 0.16 0.01"></a-text>
          <a-text id="score" value="0" color="#ffffff" align="center" width="5.2" position="0 -0.07 0.01"></a-text>
        </a-entity>

        <!-- Mensagens rápidas (acertou, errou, fim de jogo...): também em canvas, para aceitar acentos -->
        <a-plane id="feedback" width="4.2" height="0.35" position="0 -1.15 0.01"
                 material="shader: flat; src: #canvas-feedback; transparent: true"></a-plane>

        <!-- Palavra a descobrir: uma casa para cada letra, com linha embaixo -->
        <a-entity id="word-board" position="0 -1.6 0" visible="false"></a-entity>
      </a-entity>
    </a-camera>

    <!-- Ambiente: floresta -->
    <a-entity environment="preset: forest; groundColor: #445; grid: cross"></a-entity>

    <!-- Marcador de início: torre vermelha com topo dourado e placa sempre voltada para o jogador -->
    <a-entity id="start-marker" position="0 0 0">
      <a-cylinder position="0 15 0" height="30" radius="0.8" color="#e63946"></a-cylinder>
      <a-sphere position="0 30.6 0" radius="1.3" material="shader: flat; color: #ffb32c"></a-sphere>
      <a-entity position="0 35 0" look-at="[camera]">
        <a-plane width="15" height="3.4" position="0 0 -0.05" material="shader: flat; color: #ffb32c"></a-plane>
        <a-plane width="14.6" height="3" material="shader: flat; color: #071540"></a-plane>
        <a-text value="Ponto de partida" color="#ffffff" align="center" width="34" position="0 0 0.05"></a-text>
      </a-entity>
    </a-entity>

    <!-- Cartão de instruções -->
    <a-plane id="instruction-card" position="0 1.95 -3" width="3" height="2"
             material="shader: flat; src: #canvas-instrucoes; transparent: true"></a-plane>

    <!-- Letras espalhadas em 3D (inicialmente escondidas) -->
    <a-entity id="letter-grid" visible="false"></a-entity>
  </a-scene>

  // Embaralha uma lista (algoritmo de Fisher-Yates)
  function embaralhar(lista) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
    return lista;
  }

  // Junta as duas listas, embaralha e pega as primeiras TOTAL_PALAVRAS (sem repetir nenhuma).
  // Converte para o formato usado no jogo: {portuguese, english}.
  function gerarPalavras() {
    const todas = embaralhar(palavrasBase.concat(palavrasNovas));
    return todas.slice(0, TOTAL_PALAVRAS).map(function(w) {
      return { portuguese: w.p, english: w.e };
    });
  }

  // ---------- Textos em canvas
  function atualizarTextura(elemento) {
    const malha = elemento.getObject3D('mesh');
    if (malha && malha.material && malha.material.map) {
      malha.material.map.needsUpdate = true;
    }
  }

  // Desenha uma linha de texto centralizada no canvas, diminuindo a fonte se não couber
  function desenharLinha(canvasId, elemento, texto, tamanhoInicial, cor, contorno) {
    const canvas = document.querySelector(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (texto) {
      let tamanho = tamanhoInicial;
      ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
      while (ctx.measureText(texto).width > canvas.width - 40 && tamanho > 20) {
        tamanho -= 4;
        ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(6, tamanho / 8);
      ctx.strokeStyle = contorno;
      ctx.strokeText(texto, canvas.width / 2, canvas.height / 2);
      ctx.fillStyle = cor;
      ctx.fillText(texto, canvas.width / 2, canvas.height / 2);
    }
    atualizarTextura(elemento);
  }

  // Quebra um texto em linhas que cabem na largura máxima
  function quebrarLinhas(ctx, texto, larguraMaxima) {
    const palavras = texto.split(' ');
    const linhas = [];
    let atual = '';
    palavras.forEach(function(palavra) {
      const teste = atual ? atual + ' ' + palavra : palavra;
      if (ctx.measureText(teste).width > larguraMaxima && atual) {
        linhas.push(atual);
        atual = palavra;
      } else {
        atual = teste;
      }
    });
    if (atual) linhas.push(atual);
    return linhas;
  }

  // Desenha o retângulo com cantos arredondados
  function retanguloArredondado(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Desenha o cartão de instruções
  function desenharInstrucoes() {
    const canvas = document.querySelector('#canvas-instrucoes');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    retanguloArredondado(ctx, 14, 14, canvas.width - 28, canvas.height - 28, 54);
    ctx.fillStyle = 'rgba(7, 21, 64, 0.94)';
    ctx.fill();
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#ffb32c';
    ctx.stroke();

    // Título
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = 'bold 62px Arial, Helvetica, sans-serif';
    ctx.fillStyle = '#ffd27a';
    const titulo = quebrarLinhas(ctx, 'Bem-vindo ao planeta Verdelume!', canvas.width - 140);
    titulo.forEach(function(linha, i) {
      ctx.fillText(linha, canvas.width / 2, 110 + i * 72);
    });

    // Tópicos
    const topicos = [
      'Você tem 10 minutos para traduzir cada palavra em inglês e encontrar as letras espalhadas pela floresta.',
      'Aponte o cursor vermelho para a esfera com a letra e aperte ESPAÇO para confirmar.',
      'Ande com as setas do teclado ou com as teclas W, A, S, D.',
      'Complete ' + TOTAL_PALAVRAS + ' palavras para vencer o jogo.'
    ];
    const topoTopicos = 110 + (titulo.length - 1) * 72 + 36 + 45;  // logo abaixo do título
    const baseTopicos = canvas.height - 150;                        // acima do aviso "Pressione ENTER"
    const larguraTexto = canvas.width - 220;

    // Começa com fonte grande e vai diminuindo até todos os tópicos caberem no espaço disponível
    let fonte = 46;
    let linhasPorTopico;
    let altura;
    while (true) {
      ctx.font = fonte + 'px Arial, Helvetica, sans-serif';
      linhasPorTopico = topicos.map(function(t) { return quebrarLinhas(ctx, t, larguraTexto); });
      const totalLinhas = linhasPorTopico.reduce(function(soma, l) { return soma + l.length; }, 0);
      altura = totalLinhas * fonte * 1.3 + (topicos.length - 1) * fonte * 0.6;
      if (altura <= baseTopicos - topoTopicos || fonte <= 24) break;
      fonte -= 2;
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    let y = topoTopicos;
    linhasPorTopico.forEach(function(linhas) {
      ctx.fillStyle = '#ffb32c';
      ctx.fillText('•', 90, y);
      ctx.fillStyle = '#ffffff';
      linhas.forEach(function(linha, i) {
        ctx.fillText(linha, 135, y + i * fonte * 1.3);
      });
      y += linhas.length * fonte * 1.3 + fonte * 0.6;
    });

    // Aviso para começar
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = 'bold 54px Arial, Helvetica, sans-serif';
    ctx.fillStyle = '#7fe3ff';
    ctx.fillText('Pressione ENTER para começar', canvas.width / 2, canvas.height - 85);

    atualizarTextura(instrucoesElement);
  }

  // ---------- HUD ----------
  function formatTime(total) {
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function updateTimerDisplay() {
    timerElement.setAttribute('value', formatTime(timeLeft));
    // Fica vermelho no último minuto
    timerElement.setAttribute('color', timeLeft <= 60 ? '#ff6b6b' : '#ffffff');
  }

  function updateScoreDisplay() {
    scoreElement.setAttribute('value', String(score));
  }

  // Mostra uma mensagem rápida (some depois de "duration" ms; com duration 0 ela fica)
  function showFeedback(message, duration) {
    desenharLinha('#canvas-feedback', feedbackElement, message, 76, '#ffd27a', '#000000');
    clearTimeout(feedbackTimeout);
    if (duration) {
      feedbackTimeout = setTimeout(function() {
        desenharLinha('#canvas-feedback', feedbackElement, '', 76, '#ffd27a', '#000000');
      }, duration);
    }
  }

  // ---------- Quadro da palavra (uma casa para cada letra) ----------
  function buildBoard(length) {
    while (boardElement.firstChild) {
      boardElement.removeChild(boardElement.firstChild);
    }
    slotLetters = [];
    slotUnderlines = [];

    const slotW = 0.26;
    const gap = 0.09;
    const total = length * slotW + (length - 1) * gap;
    const scale = Math.min(1, 2.6 / total); // encolhe se a palavra for muito longa
    boardElement.setAttribute('scale', `${scale} ${scale} 1`);

    for (let i = 0; i < length; i++) {
      const x = -total / 2 + slotW / 2 + i * (slotW + gap);
      const slot = document.createElement('a-entity');
      slot.setAttribute('position', `${x} 0 0`);
      slot.innerHTML = `
        <a-plane width="0.26" height="0.36" material="shader: flat; color: #071540; opacity: 0.9; transparent: true"></a-plane>
        <a-plane class="underline" width="0.26" height="0.04" position="0 -0.14 0.005" material="shader: flat; color: #ffb32c"></a-plane>
        <a-text class="slot-letter" value="" align="center" color="#ffffff" width="6" position="0 0.01 0.01"></a-text>
      `;
      boardElement.appendChild(slot);
      slotLetters.push(slot.querySelector('.slot-letter'));
      slotUnderlines.push(slot.querySelector('.underline'));
    }
  }

  function renderBoard() {
    guessedLetters.forEach(function(letter, i) {
      const filled = letter !== "_";
      slotLetters[i].setAttribute('value', filled ? letter : '');
      // Linha dourada = falta preencher; verde = letra descoberta
      slotUnderlines[i].setAttribute('material', 'shader: flat; color: ' + (filled ? '#4ade80' : '#ffb32c'));
    });
  }

  // ---------- Lógica do jogo ----------
  function initializeWord() {
    const word = words[currentWordIndex];
    guessedLetters = Array(word.english.length).fill("_");

    // Enunciado: número da palavra e a palavra em português (desenhada em canvas)
    promptLabelElement.setAttribute('value', `Traduza (${currentWordIndex + 1}/${words.length})`);
    desenharLinha('#canvas-portugues', portugueseWordElement, word.portuguese, 84, '#ffffff', '#000000');

    buildBoard(word.english.length);
    renderBoard();

    // Remove as letras da palavra anterior
    const letterGrid = document.querySelector('#letter-grid');
    while (letterGrid.firstChild) {
      letterGrid.removeChild(letterGrid.firstChild);
    }

    // Cria uma esfera para cada letra, em posições aleatórias na floresta
    const positions = [];
    const gridSize = 120; // quanto maior, mais espalhadas ficam as letras
    for (let i = 0; i < word.english.length; i++) {
      let position;
      do {
        position = {
          x: (Math.random() - 0.5) * gridSize,
          y: Math.random() * 2 + 1, // altura entre 1 e 3
          z: (Math.random() - 0.5) * gridSize
        };
      } while (positions.find(p => p.x === position.x && p.z === position.z));

      positions.push(position);

      const letterEntity = document.createElement('a-entity');
      letterEntity.setAttribute('class', 'letter');
      letterEntity.setAttribute('id', `letter-${word.english[i]}`);
      letterEntity.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
      // A letra fica à frente da esfera, grande, e gira para ficar sempre de frente para o jogador
      letterEntity.innerHTML = `
        <a-sphere radius="0.6" color="${COR_LETRA}"></a-sphere>
        <a-entity face-camera>
          <a-text value="${word.english[i]}" align="center" color="#06143a" width="20" position="0 0 0.9"></a-text>
        </a-entity>
      `;
      letterGrid.appendChild(letterEntity);
    }

    addLetterSelection();
  }

  // Termina o jogo (vitória ou tempo esgotado): mostra a mensagem na tela e em um alerta
  function finishGame(message, alerta) {
    gameOver = true;
    clearInterval(countdown);
    showFeedback(message, 0);
    setTimeout(function() { alert(alerta); }, 400);
  }

  function loadWord() {
    // Chegou ao fim das palavras: parabéns!
    if (currentWordIndex >= words.length) {
      finishGame(
        `Parabéns! Você completou o jogo com ${score} pontos.`,
        `Parabéns! Você completou o jogo!\nPalavras: ${words.length}\nPontos: ${score}`
      );
      return;
    }

    initializeWord();
    updateScoreDisplay();
    timeLeft = TEMPO_POR_PALAVRA; // reinicia o tempo para cada palavra
    updateTimerDisplay();
  }

  // Cronômetro: diminui 1 segundo por vez até chegar a zero
  function startTimer() {
    countdown = setInterval(function() {
      if (timeLeft > 0) {
        timeLeft--;
        updateTimerDisplay();
      } else {
        finishGame(
          `Tempo esgotado! Pontuação final: ${score}`,
          `Tempo esgotado!\nPalavras completas: ${currentWordIndex}\nPontos: ${score}`
        );
      }
    }, 1000);
  }

  // Cor da esfera ao apontar o cursor, e guarda qual letra está selecionada
  function addLetterSelection() {
    document.querySelectorAll('.letter').forEach(function(letter) {
      letter.addEventListener('mouseenter', function () {
        selectedLetter = letter.querySelector('a-text').getAttribute('value');
        letter.querySelector('a-sphere').setAttribute('color', COR_LETRA_SELECIONADA);
      });
      letter.addEventListener('mouseleave', function () {
        selectedLetter = null;
        letter.querySelector('a-sphere').setAttribute('color', COR_LETRA);
      });
    });
  }

  // Tecla Espaço: confirma a letra apontada
  document.addEventListener('keydown', function(event) {
    if (event.code !== 'Space' || !selectedLetter || !gameStarted || gameOver) return;

    const word = words[currentWordIndex].english;
    let correctGuess = false;

    // Preenche as casas que têm a letra escolhida
    for (let i = 0; i < word.length; i++) {
      if (word[i] === selectedLetter && guessedLetters[i] === "_") {
        guessedLetters[i] = selectedLetter;
        correctGuess = true;
      }
    }

    renderBoard();

    if (correctGuess) {
      // Remove do cenário todas as esferas com a letra acertada
      document.querySelectorAll('.letter').forEach(function(el) {
        if (el.querySelector('a-text').getAttribute('value') === selectedLetter) {
          el.parentNode.removeChild(el);
        }
      });
      selectedLetter = null;

      score += 1; // um ponto por letra certa
      updateScoreDisplay();
      showFeedback('Boa! Letra certa!', 1500);
    } else {
      showFeedback('Essa letra não está na palavra', 1500);
    }

    // Palavra completa: vai para a próxima (ou para o fim do jogo, se foi a última)
    if (guessedLetters.join("") === word) {
      currentWordIndex++;
      showFeedback(currentWordIndex >= words.length ? 'Última palavra concluída!' : 'Correto! Próxima palavra...', 0);
      setTimeout(function() {
        showFeedback('', 0);
        loadWord();
      }, 2000);
    }
  });

  // Inicia o jogo: sorteia as palavras, esconde as instruções e mostra o quadro e as letras
  function startGame() {
    if (gameStarted) return; // só inicia uma vez
    gameStarted = true;

    words = gerarPalavras();

    instrucoesElement.setAttribute('visible', 'false');
    instrucoesElement.setAttribute('position', '0 -100 -3'); // tira o cartão do caminho do cursor
    document.querySelector('#word-board').setAttribute('visible', 'true');
    document.querySelector('#letter-grid').setAttribute('visible', 'true');

    loadWord();
    startTimer();
    showFeedback('Procure as esferas azuis na floresta', 6000);
  }

  // Tecla Enter: começa o jogo
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Enter') {
      startGame();
    }
  });

  // Estado inicial: desenha o cartão de instruções e o HUD
  desenharInstrucoes();
  cena.addEventListener('loaded', desenharInstrucoes); // redesenha quando a cena termina de carregar (garante a textura)
  updateTimerDisplay();
  updateScoreDisplay();
</script>
</body>
</html>
