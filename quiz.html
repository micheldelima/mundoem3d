<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de Tradução - UEPG</title>
  <meta name="description" content="Projeto de extensão 3 - UEPG">
  <meta name="author" content="Michel de Lima">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <!-- Canvas onde a palavra em português é desenhada -->
      <canvas id="canvas-portugues" width="1024" height="128"></canvas>
    </a-assets>

    <!-- Câmera e cursor -->
    <a-camera position="0 1.6 0">
      <a-cursor id="cursor" color="red"></a-cursor>
    </a-camera>

    <!-- Ambiente: mina de ouro -->
    <a-entity environment="preset: goldmine; groundColor: #445; grid: cross"></a-entity>

    <!-- Cartão de instruções -->
    <a-entity id="instruction-card" position="0 1.6 -3">
      <a-plane color="#000" width="4" height="3" material="side: double">
        <a-text value="Bem-vindo ao Quiz do Mundo em 3D da UEPG!" position="0 1 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text id="instrucao-palavras" value="- 30 segundos por palavra." position="0 0.4 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="- Use o cursor vermelho para selecionar uma esfera e a tecla ESPACO para confirmar a resposta." position="0 0 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="- Use as setas do teclado ou as letras A D W S para se movimentar." position="0 -0.4 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="Pressione Enter para iniciar" position="0 -1 0" align="center" color="#FFF" width="3.5"></a-text>
      </a-plane>
    </a-entity>

    <!-- Palavra em português a traduzir (inicialmente escondida). -->
    <a-plane id="target-word" position="0 2.5 -3" width="3.6" height="0.45"
             material="shader: flat; src: #canvas-portugues; transparent: true" visible="false"></a-plane>

    <!-- Opções de resposta: esferas com a tradução (inicialmente escondidas) -->
    <a-entity id="option1" class="option" position="-2 1.5 -3" visible="false">
      <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
      <a-text value="" align="center" color="#FFF" position="0 0.75 0" width="4"></a-text>
    </a-entity>

    <a-entity id="option2" class="option" position="-0.5 1.5 -3" visible="false">
      <a-sphere radius="0.5" color="#EF2D5E"></a-sphere>
      <a-text value="" align="center" color="#FFF" position="0 0.75 0" width="4"></a-text>
    </a-entity>

    <a-entity id="option3" class="option" position="1 1.5 -3" visible="false">
      <a-sphere radius="0.5" color="#24CAFF"></a-sphere>
      <a-text value="" align="center" color="#FFF" position="0 0.75 0" width="4"></a-text>
    </a-entity>

    <a-entity id="option4" class="option" position="2.5 1.5 -3" visible="false">
      <a-sphere radius="0.5" color="#FF6347"></a-sphere>
      <a-text value="" align="center" color="#FFF" position="0 0.75 0" width="4"></a-text>
    </a-entity>

    <a-entity id="option5" class="option" position="4 1.5 -3" visible="false">
      <a-sphere radius="0.5" color="#9ACD32"></a-sphere>
      <a-text value="" align="center" color="#FFF" position="0 0.75 0" width="4"></a-text>
    </a-entity>

    <!-- Texto de feedback (inicialmente escondido) -->
    <a-text id="feedback" value="" color="#FFF" position="0 1.5 -2.5" width="6" visible="false"></a-text>

    <!-- Texto do tempo (inicialmente escondido) -->
    <a-text id="timer" value="Time: 30" color="#FFF" position="0 3 -3" width="6" visible="false"></a-text>

    <!-- Texto da pontuação (inicialmente escondido) -->
    <a-text id="score" value="Score: 0" color="#FFF" position="2 3 -3" width="6" visible="false"></a-text>

    <!-- Contador de palavras -->
    <a-text id="word-count" value="Hits: 0 | Left: 0" color="#FFF" position="2 2.7 -3" width="4" visible="false"></a-text>  </a-scene>

  // Embaralha uma lista (algoritmo de Fisher-Yates)
  function embaralhar(lista) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
    return lista;
  }

  // Desenha o texto em português no canvas 
  function desenharPalavraPortugues(texto) {
    const canvas = document.querySelector('#canvas-portugues');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Diminui a fonte se o texto for largo demais para o canvas
    let tamanho = 84;
    ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
    while (ctx.measureText(texto).width > canvas.width - 40 && tamanho > 30) {
      tamanho -= 4;
      ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#000000';   // contorno escuro para facilitar a leitura
    ctx.strokeText(texto, canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

    // Avisa o A-Frame que o canvas mudou, para ele atualizar a textura
    const malha = targetWordElement.getObject3D('mesh');
    if (malha && malha.material && malha.material.map) {
      malha.material.map.needsUpdate = true;
    }
  }

  // Carrega a próxima palavra (ou encerra o quiz se acabaram as palavras)
  function loadWord() {
    if (currentWordIndex >= words.length) {
      isGameActive = false;
      clearInterval(countdown);
      feedbackElement.setAttribute('value', `Parabens! Voce completou o quiz com ${score} pontos.`);
      aguardando = true;
      setTimeout(function() {
        alert(`Parabéns! Você completou o quiz com ${score} pontos.`);
        aguardando = false;
      }, 300);
      return;
    }

    const word = words[currentWordIndex];
    desenharPalavraPortugues(`Traduza: ${word.portuguese}`);

    // Sorteia a posição das 5 opções e descobre em qual esfera ficou a resposta certa
    const opcoes = embaralhar([word.answer, ...word.wrong]);
    respostaCorreta = 'option' + (opcoes.indexOf(word.answer) + 1);

    // Coloca as traduções nas esferas
    for (let i = 1; i <= 5; i++) {
      document.querySelector(`#option${i} a-text`).setAttribute('value', opcoes[i - 1]);
    }

    // Reinicia o cronômetro para cada palavra
    timeLeft = 30;
    timerElement.setAttribute('value', 'Time: ' + timeLeft);
  }

  // Termina a palavra atual (acerto, fim das chances ou tempo esgotado):
  // mostra um alerta com a resposta e só depois segue para a próxima palavra.
  function encerrarPalavra(motivo) {
    const word = words[currentWordIndex];
    aguardando = true;      // pausa o tempo e ignora o Espaço enquanto o alerta aparece
    currentWordIndex++;
    chances = 3;            // reinicia as chances para a próxima palavra

     // Atualiza quantas palavras faltam (mesmo se tiver errado)
    const faltam = words.length - currentWordIndex;
    wordCountElement.setAttribute('value', `Hits: ${acertos} | Left: ${faltam}`);

    // Pequena espera para a tela atualizar o placar antes de o alerta travar a página
    setTimeout(function() {
      if (motivo === 'acerto') {
        alert(`Correto! Ganhou 10 pontos!\n${word.portuguese} = ${word.answer}\nPontos: ${score}`);
      } else if (motivo === 'chances') {
        alert(`Fim das chances! ${word.portuguese} = ${word.answer}`);
      } else {
        alert(`Tempo esgotado! ${word.portuguese} = ${word.answer}`);
      }
      feedbackElement.setAttribute('value', '');
      aguardando = false;
      loadWord();
    }, 300);
  }

  // Lógica do temporizador: diminui 1 segundo por vez. Fica parado enquanto há um alerta aberto.
  function startTimer() {
    countdown = setInterval(function() {
      if (!isGameActive) {
        clearInterval(countdown);
        return;
      }
      if (aguardando) return;

      if (timeLeft > 0) {
        timeLeft--;
        timerElement.setAttribute('value', 'Time: ' + timeLeft);
      } else {
        feedbackElement.setAttribute('value', 'Tempo Esgotado!');
        encerrarPalavra('tempo');
      }
    }, 1000);
  }

  // Detecta qual esfera está sendo apontada pelo cursor.
  // Enquanto o cursor está em cima, a esfera muda de cor.
  document.querySelectorAll('.option').forEach(function(option) {
    const esfera = option.querySelector('a-sphere');
    option.addEventListener('mouseenter', function () {
      selectedOption = option.getAttribute('id');
      esfera.setAttribute('color', COR_SELECIONADA);
    });
    option.addEventListener('mouseleave', function () {
      selectedOption = null;
      esfera.setAttribute('color', CORES_ORIGINAIS[option.getAttribute('id')]);
    });
  });

  // Tecla Espaço: confirma a esfera escolhida
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Space' && selectedOption && isGameActive && !aguardando) {
      if (selectedOption === respostaCorreta) {
        // Acertou: soma 10 pontos e mostra o alerta
        score += 10;  
        scoreElement.setAttribute('value', `Score: ${score}`);
        
        // incrementa os pontos
        acertos++;
        const faltam = words.length - acertos;
        wordCountElement.setAttribute('value', `Hits: ${acertos} | Left: ${faltam}`);

        feedbackElement.setAttribute('value', 'Correto!');
        encerrarPalavra('acerto');
      } else {
        // Errou: perde uma chance (o número de chances continua aparecendo na tela)
        chances--;
        feedbackElement.setAttribute('value', `Tente Novamente! Chances restantes: ${chances}`);
        if (chances <= 0) {
          encerrarPalavra('chances');
        }
      }
    }
  });

  // Inicia o jogo: esconde as instruções e mostra os elementos do quiz
  function startGame() {
    if (jogoIniciado) return; // só inicia uma vez
    jogoIniciado = true;
    isGameActive = true;

    document.querySelector('#instruction-card').setAttribute('visible', 'false');
    document.querySelector('#target-word').setAttribute('visible', 'true');
    document.querySelectorAll('.option').forEach(option => {
      option.setAttribute('visible', 'true');
    });
    document.querySelector('#feedback').setAttribute('visible', 'true');
    document.querySelector('#timer').setAttribute('visible', 'true');
    document.querySelector('#score').setAttribute('visible', 'true');

    // acertos/total
    wordCountElement.setAttribute('visible', 'true');
    wordCountElement.setAttribute('value', `Hits: 0 | Left: ${words.length}`);

    // Carrega a primeira palavra e inicia o cronômetro
    loadWord();
    startTimer();
  }

  // Tecla Enter: começa o jogo
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Enter') {
      startGame();
    }
  });
</script>
</body>
</html>
