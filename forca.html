<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Forca - UEPG</title>
  <meta name="description" content="Projeto de extensão 3 - UEPG">
  <meta name="author" content="Michel de Lima">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <!-- Canvas onde a palavra em português é desenhada (proporção 8:1)-->
      <canvas id="canvas-portugues" width="1024" height="128"></canvas>
    </a-assets>

    <!-- Câmera e cursor -->
    <a-camera position="0 1.6 0">
      <a-cursor id="cursor" color="red"></a-cursor>
    </a-camera>

    <!-- Ambiente: céu estrelado -->
    <a-entity environment="preset: starry; groundColor: #445; grid: cross"></a-entity>

    <!-- Cartão de instruções -->
    <a-entity id="instruction-card" position="0 1.6 -3">
      <a-plane color="#000" width="4" height="3" material="side: double">
        <a-text value="Bem-vindo ao Jogo da Forca do Mundo em 3D da UEPG!" position="0 1 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="- 10 minutos para acertar as palavras." position="0 0.4 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="- Use o cursor vermelho para selecionar uma letra e use as setas ou as letras A D W S para se movimentar." position="0 0 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="- Pressione Espaco para confirmar sua escolha." position="0 -0.4 0" align="center" color="#FFF" width="3.5"></a-text>
        <a-text value="Pressione Enter para iniciar" position="0 -1 0" align="center" color="#FFF" width="3.5"></a-text>
      </a-plane>
    </a-entity>

    <!-- Palavra oculta (traços) e palavra em português a traduzir (inicialmente escondidas) -->
    <a-text id="hidden-word" value="" color="#FFF" position="0 2.5 -3" width="6" visible="false"></a-text>
    <a-plane id="portuguese-word" position="0 2 -3" width="3.6" height="0.45"
             material="shader: flat; src: #canvas-portugues; transparent: true" visible="false"></a-plane>

    <!-- Alfabeto: uma esfera para cada letra de A a Z (inicialmente escondido) -->
    <a-entity id="alphabet" position="0 1 -3" visible="false">
  <a-entity class="letter" id="letter-A" position="-6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="A" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-B" position="-5.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="B" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-C" position="-4.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="C" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-D" position="-3.6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="D" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-E" position="-2.8 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="E" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-F" position="-2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="F" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-G" position="-1.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="G" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-H" position="-0.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="H" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-I" position="0.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="I" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-J" position="1.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="J" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-K" position="2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="K" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-L" position="2.8 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="L" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-M" position="3.6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="M" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-N" position="4.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="N" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-O" position="5.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="O" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-P" position="6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="P" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-Q" position="6.8 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="Q" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-R" position="7.6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="R" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-S" position="8.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="S" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-T" position="9.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="T" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-U" position="10 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="U" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-V" position="10.8 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="V" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-W" position="11.6 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="W" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-X" position="12.4 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="X" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-Y" position="13.2 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="Y" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
  <a-entity class="letter" id="letter-Z" position="14 0 0">
    <a-sphere radius="0.5" color="#4CC3D9"></a-sphere>
    <a-text value="Z" align="center" color="#FFF" position="0 0.75 0" width="6"></a-text>
  </a-entity>
</a-entity>


    <!-- Texto de feedback (inicialmente escondido) -->
    <a-text id="feedback" value="" color="#FFF" position="0 1.5 -2.5" width="6" visible="false"></a-text>

    <!-- Texto do tempo (inicialmente escondido) -->
    <a-text id="timer" value="Time: 600" color="#FFF" position="0 3 -3" width="6" visible="false"></a-text>

    <!-- Texto da pontuação (inicialmente escondido) -->
    <a-text id="score" value="Score: 0" color="#FFF" position="2 3 -3" width="6" visible="false"></a-text>

  </a-scene>

<script>
  // ---------- Lista de palavras ----------
  const words = [
    {portuguese: "FERRAMENTA", english: "TOOL"},
    {portuguese: "TESOURO", english: "TREASURE"},
    {portuguese: "Casa", english: "HOUSE"},
    {portuguese: "Escola", english: "SCHOOL"},
    {portuguese: "PESSOAS", english: "PEOPLE"},
    {portuguese: "Livro", english: "BOOK"},
    {portuguese: "Computador", english: "COMPUTER"},
    {portuguese: "Telefone", english: "PHONE"},
    {portuguese: "FESTA", english: "PARTY"},
    {portuguese: "Janela", english: "WINDOW"},

    {portuguese: "Gato", english: "CAT"}, {portuguese: "Pássaro", english: "BIRD"}, {portuguese: "Peixe", english: "FISH"}, {portuguese: "Cavalo", english: "HORSE"}, {portuguese: "Vaca", english: "COW"},
    {portuguese: "Porco", english: "PIG"}, {portuguese: "Ovelha", english: "SHEEP"}, {portuguese: "Galinha", english: "CHICKEN"}, {portuguese: "Pato", english: "DUCK"}, {portuguese: "Coelho", english: "RABBIT"},
    {portuguese: "Macaco", english: "MONKEY"}, {portuguese: "Leão", english: "LION"}, {portuguese: "Elefante", english: "ELEPHANT"}, {portuguese: "Tigre", english: "TIGER"}, {portuguese: "Urso", english: "BEAR"},
    {portuguese: "Cobra", english: "SNAKE"}, {portuguese: "Sapo", english: "FROG"}, {portuguese: "Tartaruga", english: "TURTLE"}, {portuguese: "Abelha", english: "BEE"}, {portuguese: "Borboleta", english: "BUTTERFLY"},
    {portuguese: "Maçã", english: "APPLE"}, {portuguese: "Banana", english: "BANANA"}, {portuguese: "Laranja", english: "ORANGE"}, {portuguese: "Uva", english: "GRAPE"}, {portuguese: "Morango", english: "STRAWBERRY"},
    {portuguese: "Leite", english: "MILK"}, {portuguese: "Pão", english: "BREAD"}, {portuguese: "Queijo", english: "CHEESE"}, {portuguese: "Ovo", english: "EGG"}, {portuguese: "Água", english: "WATER"},
    {portuguese: "Suco", english: "JUICE"}, {portuguese: "Arroz", english: "RICE"}, {portuguese: "Bolo", english: "CAKE"}, {portuguese: "Sopa", english: "SOUP"}, {portuguese: "Carne", english: "MEAT"},
    {portuguese: "Sal", english: "SALT"}, {portuguese: "Açúcar", english: "SUGAR"}, {portuguese: "Pizza", english: "PIZZA"}, {portuguese: "Biscoito", english: "COOKIE"}, {portuguese: "Sol", english: "SUN"},
    {portuguese: "Lua", english: "MOON"}, {portuguese: "Estrela", english: "STAR"}, {portuguese: "Nuvem", english: "CLOUD"}, {portuguese: "Chuva", english: "RAIN"}, {portuguese: "Neve", english: "SNOW"},
    {portuguese: "Vento", english: "WIND"}, {portuguese: "Árvore", english: "TREE"}, {portuguese: "Flor", english: "FLOWER"}, {portuguese: "Rio", english: "RIVER"}, {portuguese: "Mar", english: "SEA"},
    {portuguese: "Montanha", english: "MOUNTAIN"}, {portuguese: "Floresta", english: "FOREST"}, {portuguese: "Praia", english: "BEACH"}, {portuguese: "Pedra", english: "STONE"}, {portuguese: "Fogo", english: "FIRE"},
    {portuguese: "Céu", english: "SKY"}, {portuguese: "Cabeça", english: "HEAD"}, {portuguese: "Mão", english: "HAND"}, {portuguese: "Pé", english: "FOOT"}, {portuguese: "Olho", english: "EYE"},
    {portuguese: "Nariz", english: "NOSE"}, {portuguese: "Boca", english: "MOUTH"}, {portuguese: "Orelha", english: "EAR"}, {portuguese: "Braço", english: "ARM"}, {portuguese: "Perna", english: "LEG"},
    {portuguese: "Coração", english: "HEART"}, {portuguese: "Porta", english: "DOOR"}, {portuguese: "Mesa", english: "TABLE"}, {portuguese: "Cadeira", english: "CHAIR"}, {portuguese: "Cama", english: "BED"},
    {portuguese: "Chave", english: "KEY"}, {portuguese: "Relógio", english: "CLOCK"}, {portuguese: "Lâmpada", english: "LAMP"}, {portuguese: "Espelho", english: "MIRROR"}, {portuguese: "Caneta", english: "PEN"},
    {portuguese: "Lápis", english: "PENCIL"}, {portuguese: "Mochila", english: "BACKPACK"}, {portuguese: "Bola", english: "BALL"}, {portuguese: "Brinquedo", english: "TOY"}, {portuguese: "Cozinha", english: "KITCHEN"},
    {portuguese: "Jardim", english: "GARDEN"}, {portuguese: "Carro", english: "CAR"}, {portuguese: "Ônibus", english: "BUS"}, {portuguese: "Avião", english: "PLANE"}, {portuguese: "Barco", english: "BOAT"},
    {portuguese: "Trem", english: "TRAIN"}, {portuguese: "Bicicleta", english: "BICYCLE"}, {portuguese: "Rua", english: "STREET"}, {portuguese: "Ponte", english: "BRIDGE"}, {portuguese: "Camisa", english: "SHIRT"},
    {portuguese: "Sapato", english: "SHOE"}, {portuguese: "Chapéu", english: "HAT"}, {portuguese: "Mãe", english: "MOTHER"}, {portuguese: "Pai", english: "FATHER"}, {portuguese: "Irmão", english: "BROTHER"},
    {portuguese: "Irmã", english: "SISTER"}, {portuguese: "Amigo", english: "FRIEND"}, {portuguese: "Professor", english: "TEACHER"}, {portuguese: "Menino", english: "BOY"}, {portuguese: "Menina", english: "GIRL"}
  ];

  // Embaralha a lista (algoritmo de Fisher-Yates) para a ordem das palavras mudar a cada partida
  function embaralhar(lista) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
    return lista;
  }
  embaralhar(words);

  // ---------- Estado do jogo ----------
  let currentWordIndex = 0;   // posição da palavra atual na lista
  let guessedWord = [];       // letras já descobertas ("_" = ainda não descoberta)
  let chances = 6;            // erros permitidos por palavra
  let score = 0;              // pontuação total
  let timeLeft = 600;         // tempo total do jogo, em segundos (10 minutos)
  let countdown = null;       // guarda o temporizador (setInterval)
  let selectedLetter = null;  // letra para a qual o cursor está apontando
  let aguardando = false;     // true enquanto o alerta está para aparecer ou aberto (ignora o Espaço)
  let jogoIniciado = false;   // evita iniciar o jogo duas vezes ao apertar Enter de novo

  // Cores das esferas: normal e quando o cursor está em cima
  const COR_ESFERA = '#4CC3D9';
  const COR_ESFERA_SELECIONADA = '#FFD700';
  const timerElement = document.querySelector('#timer');
  const feedbackElement = document.querySelector('#feedback');
  const hiddenWordElement = document.querySelector('#hidden-word');
  const portugueseWordElement = document.querySelector('#portuguese-word');
  const scoreElement = document.querySelector('#score');

  // Desenha o texto em português no canvas
  function desenharPalavraPortugues(texto) {
    const canvas = document.querySelector('#canvas-portugues');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Diminui a fonte se o texto for largo demais para o canvas
    let tamanho = 84;
    ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
    while (ctx.measureText(texto).width > canvas.width - 40 && tamanho > 30) {
      tamanho -= 4;
      ctx.font = `bold ${tamanho}px Arial, Helvetica, sans-serif`;
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 10;
    ctx.strokeStyle = '#000000';   // contorno escuro para facilitar a leitura
    ctx.strokeText(texto, canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(texto, canvas.width / 2, canvas.height / 2);

    // Avisa o A-Frame que o canvas mudou, para ele atualizar a textura
    const malha = portugueseWordElement.getObject3D('mesh');
    if (malha && malha.material && malha.material.map) {
      malha.material.map.needsUpdate = true;
    }
  }

  // Prepara a palavra atual: mostra a palavra em português e os traços da resposta
  function initializeWord() {
    const word = words[currentWordIndex];
    guessedWord = Array(word.english.length).fill("_");
    hiddenWordElement.setAttribute('value', guessedWord.join(" "));
    desenharPalavraPortugues(`Traduza: ${word.portuguese}`);
  }

  // Carrega a próxima palavra (ou encerra o jogo se acabaram as palavras)
  function loadWord() {
    if (currentWordIndex >= words.length) {
      feedbackElement.setAttribute('value', `Parabens! Voce completou o jogo com ${score} pontos.`);
      clearInterval(countdown); // para o tempo quando o jogo termina
      return;
    }

    initializeWord();
    chances = 6;
    scoreElement.setAttribute('value', `Score: ${score}`);
  }

  // Lógica do tempo: diminui 1 segundo por vez até chegar a zero
  function startTimer() {
    if (countdown === null) { // só inicia o tempo se ele ainda não estiver rodando
      countdown = setInterval(function() {
        if (timeLeft > 0) {
          timeLeft--;
          timerElement.setAttribute('value', 'Time: ' + timeLeft);
        } else {
          clearInterval(countdown);
          feedbackElement.setAttribute('value', 'Tempo Esgotado!');
          setTimeout(() => {
            feedbackElement.setAttribute('value', `Fim do jogo! Seu score final é ${score}`);
          }, 1000);
        }
      }, 1000);
    }
  }

  // Detecta qual letra está sendo apontada pelo cursor (entra e sai da esfera).
  // Enquanto o cursor está em cima, a esfera muda de cor.
  document.querySelectorAll('.letter').forEach(function(letter) {
    letter.addEventListener('mouseenter', function () {
      selectedLetter = letter.querySelector('a-text').getAttribute('value');
      letter.querySelector('a-sphere').setAttribute('color', COR_ESFERA_SELECIONADA);
    });
    letter.addEventListener('mouseleave', function () {
      selectedLetter = null;
      letter.querySelector('a-sphere').setAttribute('color', COR_ESFERA);
    });
  });

  // Tecla Espaço: confirma a letra escolhida
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Space' && selectedLetter && !aguardando) {
      const word = words[currentWordIndex].english;
      let correctGuess = false;

      // Preenche todas as posições da palavra que têm a letra escolhida
      for (let i = 0; i < word.length; i++) {
        if (word[i] === selectedLetter) {
          guessedWord[i] = selectedLetter;
          correctGuess = true;
        }
      }

      hiddenWordElement.setAttribute('value', guessedWord.join(" "));

      // Letra errada: perde uma chance (o número de chances continua aparecendo na tela)
      if (!correctGuess) {
        chances--;
        feedbackElement.setAttribute('value', `Chances restantes: ${chances}`);
      }

      // Palavra completa: soma as chances que sobraram à pontuação
      const palavraCompleta = guessedWord.join("") === word;
      if (palavraCompleta) {
        score += chances;
      }
      scoreElement.setAttribute('value', `Score: ${score}`);

      // Acertou a palavra ou acabaram as chances: mostra um alerta e passa para a próxima palavra
      if (palavraCompleta || chances <= 0) {
        aguardando = true;
        currentWordIndex++;

        // Pequena espera para a tela desenhar a última letra antes de o alerta travar a página
        setTimeout(function() {
          if (palavraCompleta) {
            alert(`Correto! A palavra era ${word}.\nPontos: ${score}`);
          } else {
            alert(`Fim das chances! A palavra era ${word}.`);
          }
          feedbackElement.setAttribute('value', '');
          aguardando = false;
          loadWord();
        }, 300);
      }
    }
  });

  // Inicia o jogo: esconde as instruções e mostra os elementos do jogo
  function startGame() {
    if (jogoIniciado) return; // só inicia uma vez
    jogoIniciado = true;

    document.querySelector('#instruction-card').setAttribute('visible', 'false');
    document.querySelector('#hidden-word').setAttribute('visible', 'true');
    document.querySelector('#portuguese-word').setAttribute('visible', 'true');
    document.querySelector('#alphabet').setAttribute('visible', 'true');
    document.querySelector('#feedback').setAttribute('visible', 'true');
    document.querySelector('#timer').setAttribute('visible', 'true');
    document.querySelector('#score').setAttribute('visible', 'true');

    loadWord();
    startTimer();
  }

  // Tecla Enter: começa o jogo
  document.addEventListener('keydown', function(event) {
    if (event.code === 'Enter') {
      startGame();
    }
  });
</script>
</body>
</html>
